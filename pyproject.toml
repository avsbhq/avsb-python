[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "avsb"
version = "1.0.0"
description = "A vs B feature-flag and experimentation SDK for Python (server-side)."
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "AvsB"}]
dependencies = []

[project.optional-dependencies]
fastapi = ["fastapi>=0.100", "httpx>=0.25"]
flask = ["flask>=2.3"]
django = ["django>=4.2"]
redis = ["redis>=5.0"]
aws = ["boto3>=1.34"]
postgres = ["psycopg[binary]>=3.1"]
openfeature = ["openfeature-sdk>=0.5"]
streaming = ["httpx>=0.25"]
test = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-cov>=4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["src/avsb"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.hatch.build.targets.wheel]
packages = ["src/avsb"]
